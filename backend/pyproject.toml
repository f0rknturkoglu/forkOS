[project]
name = "forkos-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "feedparser>=6.0",
  "apscheduler>=3.10",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "selectolax>=0.3.21",
  "rich>=13.7",
  "typer>=0.12",
  "python-jobspy==1.1.82",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "no_database: test does not need a database connection",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["app/sources/forkjob_core"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
  # FastAPI'de Depends()/Query() varsayilan argumanda cagrilir -- idiomatik
  "B008",
  "E501",
]
