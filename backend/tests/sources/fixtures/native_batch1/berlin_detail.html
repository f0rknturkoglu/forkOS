T-Mitarbeitenden, legst Taktiken für den operativen Alltag fest und verbesserst kontinuierlich unsere internen IT-Prozesse. Mit deinen analytischen Fähigkeiten unterstützt du bei komplexeren Fehleranalysen, um Problemlösungskompetenzen im Team aufzubauen. Du scheust dich im Tagesgeschäft nicht davor, auch operativ bei Bedarf zu unterstützen und Aufgaben hands-on selbst zu erledigen.</li>\n \t<li>Architektur, Datenstrukturen &amp; Skalierung: Du optimierst unser bestehendes System (No-Code Automatisierungsplattformen, Tools für Dateneingaben und unser hauseigenes ERP-System), definierst Datenstrukturen und machst unseren Tech-Stack fit für IT-Audits großer B2B-Kunden (denkbare ERP-Anbindungen wie SAP, Microsoft Dynamics, etc) sowie AI-Anbindungen.</li>\n \t<li>Qualitätssicherung (QS) &amp; Prozesse: Du führst Best Practices und optimierst unsere Standards für die No-Code- und Code-Entwicklung ein (Beispiele: Dev/Staging-Umgebungen, striktes Error-Handling, automatisches Fehler-Monitoring, Tracking, lückenlose Dokumentation). Du machst techn. Reviews sowie sorgst für die Bereitstellung qualitativer Testdaten und Testumgebungen.</li>\n \t<li>Agile Weiterentwicklungen &amp; Planung von Refacturings: Du konzipierst nachhaltige Lösungsansätze mit, definierst einheitliche Datenmodelle und Protokolle, und bist Ansprechpartner einerseits für Product-Owner, im Business Development als auch bei Mitwirkenden in der jeweiligen Umsetzung. Bei komplexen oder geschäftskritischen Parts von Umsetzungen hilfst du bei Bedarf mit oder sorgst dafür, dass sie gewissenhaft, sicher, qualitativ und nachhaltig umgesetzt werden.</li>\n \t<li>Analytische Exzellenz: Wenn Datenflüsse stocken, API-Limits erreicht werden oder unvorhergesehene Fehler in den Tool-Schnittstellen auftreten, unterstützt du bei Bedarf die Ursachenanalyse tiefgehend und systematisch, entwickelst nachhaltige Lösungen für die Zukunft und leitest die Behebung an.</li>\n</ul>\n<strong>Qualifikation</strong>\n\n<strong>Das bringst du mit (Dein Profil)</strong>\n<ul>\n \t<li>Erfahrung im Startup-Umfeld: Du hast mindestens 5 Jahre Erfahrung in einer gestaltenden oder anleitenden IT/Operations-Rolle und liebst das dynamische Umfeld eines Startups.</li>\n \t<li>No-Code- &amp; API-Experte mit Code-Verständnis: Du beherrschst eine No-Code-Plattform (n8n, Make, etc.) auf Experten-Niveau (Webhooks, API-Anbindungen, Fehler-Handling, komplexe Daten-Operationen, asynchrone eventbasierte Architekturen). Du verstehst relationale Datenbankstrukturen im Detail. Du hast Erfahrungen in Code (PHP, JavaScript), um entwickelte Framework-Plugins im Blick zu behalten.</li>\n \t<li>Starke analytische Denkweise: Du besitzt eine ausgeprägte Fähigkeit zur Ursachenanalyse (Root-Cause-Analysis) sowie Konzeption verbesserter Ansätze. Du verlierst bei komplexen, verschachtelten Systemen und Datenströmen nicht den Überblick und liebst es, Ungereimtheiten bei uns systematisch aufzuspüren und nachhaltig Lösungsansätze zu etablieren.</li>\n \t<li>Hands-on-Mentalität &amp; Flexibilität: Du verbindest strategisches Denken mit operativer Tatkraft. Du bist dir nicht \"zu fein\", selbst Datenfelder anzulegen oder Automatisierungs-Szenarien zu klicken.</li>\n \t<li>Empathische Führungskraft: Du hast echte Freude daran, Wissen weiterzugeben, Leitplanken zu setzen und zukünftige Nachwuchstalente strukturiert und geduldig aufzubauen.</li>\n</ul>\n<strong>Benefits</strong>\n\nWir sind kein Konzern mit gigantischen IT-Gehältern, Hierarchien und fehlender Wirksamkeit. Es ist viel besser:\n<ul>\n \t<li>Direkter Impact: Du gestaltest die Zukunft in einem der wichtigsten regulatorischen Märkte der nächsten Jahre (PPWR, EPR &amp; verbessertes Recycling von Materialien)</li>\n \t<li>Co-CTO Perspektive**:** Enge Zusammenarbeit und strategisches Sparring direkt mit dem Gründerteam und dem CTO.</li>\n \t<li>Ein unbefristeter Arbeitsvertrag in attraktivem Teilzeit-Modell, das zu dir passt (32h/Woche)</li>\n \t<li>Flexible Arbeitszeit- und -o
