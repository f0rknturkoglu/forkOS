+00:00\", \"status\": \"active\", \"posted_day\": \"2026-09-30\"}, {\"id\": \"jobtech:31535332\", \"source\": \"jobtech\", \"company\": \"2Complete AB\", \"title\": \"Finance Specialist till Lynes i Solna\", \"location_raw\": \"Solna, Sverige\", \"country\": \"Sweden\", \"city\": \"Solna\", \"category\": \"finance\", \"seniority\": \"unknown\", \"min_years\": null, \"english_ok\": false, \"remote\": false, \"visa_hint\": false, \"description\": \"Som Finance Specialist hos Lynes får du en bred och betydelsefull roll där ekonomi, affär och människor möts. Här får du stort eget ansvar, arbetar nära CFO och blir en viktig del av en verksamhet som ligger långt framme inom digitalisering, automatisering och AI.\\nVad erbjuder vi?\\nEn bred och varierad roll inom ekonomi där du får arbeta med hela det löpande ekonomiflödet.\\nNära samarbete med CFO och insyn i flera delar av verksamheten.\\nMöjlighet att påverka och utveckla ekonomirutiner och arbetssätt.\\nEn modern arbetsmiljö där automatisering och AI redan är en naturlig del av ekonomiarbetet.\\nEn roll med både självständigt ansvar och många kontaktytor internt och externt.\\n\\nLynes är ett företag med ett starkt fokus på digitalisering och smarta lösningar, där även ekonomiavdelningen arbetar aktivt med att förenkla och automatisera processer. I dagsläget finns exempelvis en AI-agent som analyserar och kontrollerar att bolaget har blivit korrekt fakturerat på hundratals avtal, samtidigt som AI används för att delvis automatisera arbetet med återförsäljarprovisioner. Här finns därför goda möjligheter för dig som vill kombinera gedigen ekonomikompetens med ett intresse för utveckling, effektivisering och nya arbetssätt. På kontoret i Solna arbetar nio personer och du rapporterar direkt till CFO.\\nVem söker vi?\\nVi söker dig som har en bred bakgrund inom ekonomi och redovisning och som är trygg i att självständigt hantera det löpande ekonomiarbetet. Du har förståelse för hur bokföring, reskontra, lön, deklarationer, bokslut och rapportering hänger ihop och trivs samtidigt i en roll där du har återkommande kontakt med kunder och återförsäljare.\\nKrav och kvalifikationer:\\nDu har erfarenhet av brett ekonomiarbete och känner dig trygg med att arbeta självständigt med den löpande redovisningen\\nErfarenhet av månadsbokslut och gärna årsbokslut\\nErfarenhet av kontoavstämningar samt kund- och leverantörsreskontra.\\nErfarenhet av momsrapportering och arbetsgivardeklarationer\\nErfarenhet av löneadministration\\nGod vana av ekonomi- och lönesystem samt Excel\\nFlytande svenska i tal och skrift och god engelska.\\n\\nSom person är du noggrann, strukturerad och ansvarstagande. Du har lätt för att skapa ordning, hålla koll på deadlines och följa upp avvikelser tills de är lösta. Du är trygg i att arbeta självständigt men vet också när det är rätt läge att stämma av med CFO.\\nEftersom rollen innebär många kontaktytor är det viktigt att du är serviceinriktad och kommunikativ och kan förklara ekonomiska frågor på ett enkelt, tydligt och professionellt sätt. Du ser gärna möjligheter till förbättring och effektivisering och uppskattar att hitta smartare sätt att arbeta, exempelvis genom digitalisering, automatisering och AI.\\nVad innebär rollen?\\nSom Finance Specialist hos Lynes får du en central roll i det dagliga ekonomiarbetet och blir en viktig del av verksamheten. Du arbetar nära CFO och får möjlighet att ta ett stort eget ansvar för att ekonomiflödet fungerar korrekt och effektivt, från löpande bokföring och reskontra till bokslut, rapportering och löneadministration. Samtidigt är rollen social och varierad, då du har återkommande kontakt med både kunder och återförsäljare via telefon och mejl.\\nMed arbetsuppgifter som exempelvis inkluderar:\\nMånadsbokslut och arbete med årsbokslut tillsammans med CFO\\nLöpande bokföring och kontoavstämningar\\nKund- och leverantörsreskontra\\nMomsrapportering och arbetsgivardeklarationer på individnivå (AGI)\\nLöneadministration, kontroll av löneunderlag och avstämning av lönebokföring\\nÅterkommande rapportering till myndigheter\\nHantering av kunders faktura- och avtalsfrågor via telefon och mejl\\nBeräkning och avstämning av återförsäljarprovisioner\\nUppföljning av avvikelser och säkerställande av att underlag och siffror är korrekta\\nBidra till att utveckla, effektivisera och automatisera ekonomiska processer.\\n\\nTjänsten är en direktrekrytering till Lynes på heltid, med start enligt överenskommelse. Arbetsprov förekommer som en del av rekryteringsprocessen. Rekryteringsprocessen innehåller även bakgrundskontroll som sammanställer tidigare offentligt brottsregister och ekonomisk skuldupplysning. Intresserad? Skicka in din ansökan snarast, tjänsten kan komma att tillsättas innan sista ansökningsdag.\\nOm 2Complete\\nTrygghet och förtroende är målen i 2Completes rekryteringsprocess. Detta uppnås genom ett nära och personligt samarbete med de kunder som valt oss som sin rekryteringspartner. Vår passion för att få ut människor i arbete och att få in rätt person i rätt sammanhang i arbetslivet, driver oss framåt.\\n2Complete Group samt alla dess dotterbolag är auktoriserade medlemmar inom Kompetensföretagen, Almega samt Svenskt Näringsliv och har varit det sedan 2011.\\n2Complete Group är Gasellen vinnare 2022, utmärkelsen som tilldelas Sveriges snabbast växande företag.\", \"url\": \"https://arbetsformedlingen.se/platsbanken/annonser/31535332\", \"posted_at\": \"2026-09-30T09:56:38+00:00\", \"first_seen\": \"2026-09-30T09:56:29.965+00:00\", \"last_seen\": \"2026-09-30T10:28:42.174+00:00\", \"status\": \"active\", \"posted_day\": \"2026-09-30\"}], \"pagination\": \"$L4b\", \"initialId\": null}\n"])</script>
