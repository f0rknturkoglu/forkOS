take DoorDash's compliance program from something people run to something the platform runs on its own. You'll take primary ownership of how regulatory and framework change gets tracked, interpreted, and turned into real controls - one part of a broader GRC function that spans audit, policy, and risk. Day to day, that means less time updating spreadsheets and more time writing the automation, integrations, and control logic that let audit evidence collect itself. </p>\\n<p>You'll also lead major external audits from start to finish and help shape the policies and control standards the rest of the program is built on.</p>\\n<p>This is a hands-on role for someone who already has deep audit and assurance experience, wants to spend more time building than briefing and can move a program forward, and change how people work, without needing the title to make it happen.</p>\\n<h3><strong>You’re excited about this opportunity because you will…</strong></h3>\\n<ul>\\n<li>Build the regulatory and framework change-management process that keeps DoorDash ahead of new obligations, instead of reacting to them.</li>\\n<li>Move manual, point-in-time compliance work onto Compliance-as-Code foundations: policy-as-code, automated control testing, and continuous evidence collection wired into CI/CD, so audit readiness holds up between audits, not just during them.</li>\\n<li>Design and run agentic workflows for evidence analysis, control testing, and audit response preparation, with a human in the loop where assurance demands it.</li>\\n<li>Partner directly with engineering and architecture teams to design controls into new systems at build time and translate that technical work into the narratives auditors actually need.</li>\\n<li>Partner with the Security Compliance Manager to shape and mature the global compliance program. </li>\\n<li>Design, implement and validate security controls relevant to DoorDash’s regulatory environment, not just document them.</li>\\n<li>Support development and refinement of security policies, standards, and guidance. </li>\\n<li>Mentor other members of the compliance team and help set the technical bar the rest of the function grows into.</li>\\n<li>Ensure policies are actionable, testable, and aligned to real-world controls. </li>\\n</ul>\\n<h3><strong>We’re excited about you because you have…</strong></h3>\\n<ul>\\n<li>6+ years of experience in security compliance, GRC or technology risk, with a strong track record in high-growth, technology-driven and regulated environments. </li>\\n<li>Hands-on experience building large language models and agent workflows with daily use of AI in your own work, grounded judgment on what to delegate to agents versus what needs a human, and the ability to evidence both to an auditor. DoorDash is an AI-forward organization and the ability to optimize efficiency using AI is crucial in this role.</li>\\n<li>The ideal candidate brings hands-on experience with frameworks such as DORA, the EU AI Act, NIS2 and CRA. </li>\\n<li>Real, hands-on experience implementing and assessing controls against frameworks like PCI DSS, SOC 2, ISO 27001 - not just reading them.</li>\\n<li>Demonstrated ability to identify control gaps, assess risk and drive remediation in partnership with cross-functional stakeholders. </li>\\n<li>Experience developing, implementing and improving security policies, standards, and procedures, ensuring they are operational and effective.</li>\\n<li>Strong understanding of compliance metrics and reporting, with the ability to track control effectiveness, audit outcomes, and risk exposure. </li>\\n<li>Ability to influence and drive accountability across technical and non-technical stakeholders. </li>\\n<li>Excellent verbal and written communication skills, with the ability to translate complex audit and compliance requirements into clear, actionable guidance. </li>\\n<li>Comfort owning compliance metrics and reporting - you can show, not just assert, that a program is working.</li>\\n<li>Bachelor’s degree in Information Security, Computer Science, or related field, or equivalent practical experience. </li>\\n</ul>\\n<h3><strong>About DoorDash</strong></h3>\\n<p>DoorDash is a technology company that connects customers with their favorite local and national businesses in over 4,000 cities and all 50 states across the United States and Canada. Founded in 2013, DoorDash empowers merchants to grow their businesses by offering on-demand delivery, data-driven insights, and better in-store efficiency, providing delightful experiences from door to door. By building the last-mile delivery infrastructure for local cities, DoorDash is bringing communities closer, one doorstep at a time. Read more on the <a href=\\\"https://blog.doordash.com/\\\">DoorDash blog</a> or at <a href=\\\"http://www.doordash.com\\\">www.doordash.com</a>. </p>\\n<h3><strong>Our Commitment to Diversity and Inclusion</strong></h3>\\n<p>We’re committed to growing and empowering a more inclusive community within our company, industry, and cities. That’s why we hire and cultivate diverse teams of the best and brightest from all backgrounds, experiences, and perspectives. We believe that true innovation happens when everyone has room at the table and the tools, resources, and opportunity to excel. </p><div class=\\\"content-conclusion\\\"><p><strong>Diversity, Equity and Inclusion</strong><br><br>At Deliveroo, we know that a great workplace reflects the world around us and that true diversity and inclusion make us stronger, more creative, and better at what we do. We’re committed to fostering an environment where everyone can do their best work and feel they belong.</p>\\n<p>We believe in equality of opportunity and welcome candidates from all backgrounds regardless of age, gender, ethnicity, disability, sexual orientation, gender identity, socio-economic background, religion, or belief.</p>\\n<p>If you have a disability or long-term health condition and need support to apply for o eroo is the perfect environment to build an engineering career, driven by impact. Firstly, the impact that working here will have on your development, allowing you to grow faster than you might elsewhere; secondly, the impact that you can have on Deliveroo, leaving your mark as we scale; and finally, being part of something bigger, through the impact that we make together in our marketplace and communities.</p>\\n<p><strong>The Role</strong></p>\\n<p>Working as part of our analytics engineering team and reporting to one of our Analytics Engineering Managers, your role will be to provide clean, tested, well-documented and well-modelled data sets, that will enable and empower data scientists and business users alike, via tools like Snowflake and/or Looker.</p>\\n<ul>\\n<li>You'll work with product engineering teams to ensure modelling of source data meets downstream requirements.</li>\\n<li>You will maintain and develop SQL data transformation scripts, and advise and review data scientists on data modelling to achieve denormalised and aggregated output datasets.</li>\\n<li>You'll work with data scientists and other analytics engineers to surface clean, intuitive datasets in our BI tool, Looker.</li>\\n<li>You will be responsible for optimisation and further adoption of Looker as a data product in the business, catering to ~1500 current active users who need to discover and interact with data.</li>\\n</ul>\\n\\n<p><strong>Skillset</strong></p>\\n<p>Required</p>\\n<ul>\\n<li>6+ years Analytics Engineering / Data Engineering / BI Engineering experience</li>\\n<li>Excellent SQL skills</li>\\n<li>Understanding of data warehousing, data modelling concepts and structuring new data tables</li>\\n<li>Knowledge of cloud-based MPP data warehousing (e.g. Snowflake, BigQuery, Redshift)</li>\\n</ul>\\n<p>Nice to have</p>\\n<ul>\\n<li>Experience developing in a BI tool (Looker or similar)</li>\\n<li>Good practical understanding of version control</li>\\n<li>SQL ETL/ELT knowledge, experience with DAGs to manage script dependencies</li>\\n<li>Python coding skills, particularly in the areas of automation & integrations</li>\\n<li>Good knowledge of the Looker API</li>\\n</ul>\\n<p><strong>Workplace & Diversity</strong></p>\\n<p>At Deliveroo we know that people are the heart of the business and we prioritise their welfare. We offer multiple great benefits in areas including health, family, finance, community, convenience, growth and relocation.</p>\\n<p>We believe a great workplace is one that represents the world we live in and how beautifully diverse it can be. That means we have no judgement when it comes to any one of the things that make you who you are - your gender, race, sexuality, religion or a secret aversion to coriander. All you need is a passion for (most) food and a desire to be part of one of the fastest growing start-ups around.</p><div class=\\\"content-conclusion\\\"><p><strong>Diversity, Equity and Inclusion</strong><br><br>At Deliveroo, we know that a great workplace reflects the world around us and that true diversity and inclusion make us stronger, more creative, and better at what we do. We’re committed to fostering an environment where everyone can do their best work and feel they belong.</p>\\n<p>We believe in equality of opportunity and welcome candidates from all backgrounds regardless of age, gender, ethnicity, disability, sexual orientation, gender identity, socio-economic background, religion, or belief.</p>\\n<p>If you have a disability or long-term health condition and need support to apply for one of our roles, or require any reasonable adjustments during the recruitment process, you’ll have the opportunity to let us know once you’ve submitted your application. We’ll share details on how to request support so we can ensure you have a fair and equitable experience.</p>\\n<p>If you’re excited about making a real impact in a fast-moving marketplace and growing your career alongside ambitious, supportive teams, we’d lov d\": \"c57e72dd-43d9-4bab-be6f-0b1f5cd24140\", \"companyLogo\": \"DE\", \"companyLogoUrl\": \"/logos/deliveroo.png\", \"companyColor\": \"#00CDBC\", \"companySize\": \"1000+ employees\", \"companyDesc\": \"Pioneering on-demand food delivery tech company serving millions of customers across the UK and Europe with smart logistics algorithms.\", \"salaryMin\": 58000, \"salaryMax\": 80000, \"currency\": \"GBP\", \"locationType\": \"Hybrid\", \"location\": \"London, United Kingdom\", \"seniority\": \"Mid\", \"techStack\": [\"Product Strategy\", \"Figma\", \"Agile\"], \"industry\": \"IT / Software\", \"category\": \"Product & Design\", \"isHot\": false, \"isNew\": true, \"isFeatured\": false, \"postedAt\": \"Sep 25, 2026\", \"description\": \"<div class=\\\"content-intro\\\"><p><strong>Our Global Structure</strong></p>\\n<p><br>Deliveroo is now part of DoorDash, bringing together teams with even greater reach, scale, and ambition. Depending on your role, you may collaborate with teammates, systems, and leaders across DoorDash and Wolt. Together, we’re unlocking new possibilities as one global team.</p></div><p>Join us in our mission to transform the way people shop and eat, where impact, innovation and growth drive everything we do. Our Product team defines how millions of people experience Deliveroo, turning complex marketplace challenges into simple, high-impact solutions.</p>\\n<p>Working at the intersection of data, design and engineering, we set direction, prioritise what matters most, and deliver outcomes that move the business forward.</p>\\n<p>We’re looking for a Senior Product Manager to join our London team. This is a hybrid role. In this role, you’ll help us own the vision, strategy, and execution for Double Order—transforming one of our most exciting consumer bets into a scaled, lasting part of how people use Deliveroo.</p>\\n\\n<h2>What You’ll Be Doing</h2>\\n<p>You’ll be joining the Double Order team. Double Order allows customers to add a second restaurant or store to a single delivery, sitting directly at the intersection of customer experience, marketplace economics, and real-world logistics. You will be responsible for balancing these forces to find creative, high-impact moves that grow the business and delight customers simultaneously.</p>\\n<p>Here’s what your day-to-day might look like:</p>\\n<ul>\\n<li>\\n<p><strong>Own vision and strategy:</strong> Define and execute the end-to-end roadmap and OKRs for Double Order, taking it from early discovery through to a scaled, sustainable product.</p>\\n</li>\\n<li>\\n<p><strong>Balance complex marketplace dynamics:</strong> Solve for customer value and business growth alongside the underlying economics and logistics required to make multi-order journeys viable.</p>\\n</li>\\n<li>\\n<p><strong>Drive cross-functional collaboration:</strong> Partner closely with Engineering, Design, Data, Logistics, Finance, and Market teams to ship, learn, and iterate at pace.</p>\\n</li>\\n<li>\\n<p><strong>Combine data with strong judgement:</strong> Lead experiment-driven development, navigating incomplete information, and knowing when to incrementally optimise versus completely rethink an approach.</p>\\n</li>\\n<li>\\n<p><strong>Align senior stakeholders:</strong> Communicate strategy, trade-offs, and key learnings clearly to build wide organisation-level conviction in your domain's direction.</p>\\n</li>\\n</ul>\\n\\n<h2>What You’ll Need to Thrive</h2>\\n\\n<h3>Essential Requirements</h3>\\n<ul>\\n<li>\\n<p><strong>Demonstrated product ownership:</strong> Proven track record of delivering measurable outcomes for consumer-facing products operating at scale.</p>\\n</li>\\n<li>\\n<p><strong>Broad domain experience:</strong> Breadth across multiple stages of the customer journey (e.g. checkout, discovery, pricing, retention) with an ability to connect strategic dots across complex systems.</p>\\n</li>\\n<li>\\n<p><strong>Navigating ambiguity and trade-offs:</strong> Experience taking ownership of high-stakes, ambiguous problems and balancing competing business priorities within a marketplace, platform, or low-margin environment.</p>\\n</li>\\n<li>\\n<p><strong>Analytical and commercial rigour:</strong> Strong quantitative skills paired with sound business instincts to validate hypotheses and make consequential calls.</p>\\n</li>\\n<li>\\n<p><strong>Cross-functional and stakeholder leadership:</strong> Proven ability to build trust across multidisciplinary teams (Engineering, Design, Data, Operations, Finance) and align senior stakeholders on difficult trade-offs.</p>\\n</li>\\n<li>\\n<p><strong>Exceptional communication:</strong> Clear, concise written and verbal communication skills with the ability to articulate complex strategies with conviction.</p>\\n</li>\\n</ul>\\n<h3>Nice to Have</h3>\\n<ul>\\n<li>\\n<p>Experience with bundling, multi-order, or complex marketplace logistics products.</p>\\n</li>\\n<li>\\n<p>Deep familiarity with large-scale experimentation frameworks and product development.</p>\\n</li>\\n</ul>\\n\\n<h2>Why Join Us?</h2>\\n<p>At Deliveroo, you’ll do work that matters, solving real-world problems in a three-sided marketplace that’s constantly evolving.</p>\\n<p>We’re food lovers, problem solvers, community builders and more, brought together by a shared drive to make things better. Working here you can expect to:</p>\\n<p>🔧 <strong>Solve meaningful problems at real scale</strong></p>\\n<p>Work on a complex, always-on marketplace that impacts millions every day.</p>\\n<p>🌱 <strong>See your impact, fast</strong></p>\\n<p>Ship, test and improve ideas quickly in a low-hierarchy, high-ownership environment.</p>\\n<p>🧠 <strong>Grow through challenge and ownership</strong></p>\\n<p>Take on big, ambiguous problems and accelerate your career with strong support.</p>\\n<p>🌎 <strong>A culture built for builders</strong></p>\\n<p>High standards, collaboration, flexible working and continuous learning.</p>\\n<p>💰 <strong>Share in the success you help create</strong></p>\\n<p>Competitive salary and equity options, so you’re rewarded for the impact you make.</p>\\n<p>➡️ Want a deeper look at how we build? Check out our <a class=\\\"ng-star-inserted\\\" href=\\\"deliveroo.engineering\\\" target=\\\"_blank\\\">Tech Blog</a>.</p>\\n<p>We aim to create a fair process that lets your skills shine—our interview typically includes 3-4 stages. Find more about how we hire <a class=\\\"ng-star-inserted\\\" href=\\\"https://careers.deliveroo.co.uk/how-we-hire/\\\" target=\\\"_blank\\\">here</a>.</p>\\n<div class=\\\"content-conclusion\\\"><p><strong>Diversity, Equity and Inclusion</strong><br><br>At Deliveroo, we know that a great workplace reflects the world around us and that true diversity and inclusion make us stronger, more creative, and better at what we do. We’re committed to fostering an environment where everyone can do their best work and feel they belong.</p>\\n<p>We believe in equality of opportunity and welcome candidates from all backgrounds regardless of age, gender, ethnicity, disability, sexual orientation, gender identity, socio-economic background, religion, or belief.</p>\\n<p>If you have a disability or long-term health condition and need support to apply for one of our roles, or require any reasonable adjustments during the recruitment process, you’ll have the opportunity to let us know once you’ve submitted your application. We’ll share details on how to request support so we can ensure you have a fair and equitable experience.</p>\\n<p>If you’re excited about making a real impact in a fast-moving marketplace and growing your career alongside ambitious, supportive teams, we’d love to hear from you!</p>\\n<p><em data-renderer-mark=\\\"true\\\"><br>Beware of recruitment scams: DASH Brands will never ask you to pay money or share sensitive financial information during hiring — learn more about DASH Brands' legitimate recruiting process at</em> <a class=\\\"_ymio1r31 _ypr0glyw _zcxs1o36 _miz
