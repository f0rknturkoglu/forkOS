<script type="application/ld+json">[{"@context": "https://schema.org", "@type": "JobPosting", "title": "Support Engineer (EMEA)", "description": "<p><a href=\"https://jobicy.com/company/supabase\">Supabase</a> is the Postgres development platform, built by developers for developers. We provide a complete backend solution including Database, Auth, Storage, Edge Functions, Realtime, and Vector Search. All services are deeply integrated and designed for growth.</p>\n<p>We are seeking Support Engineers to provide world-class <strong>developer support</strong> for anyone experiencing issues or seeking guidance when using Supabase. The support team is globally distributed with a strong focus on minimizing time to fix, and works closely with the product engineering and growth teams.</p>\n<p><strong>You will:</strong></p>\n<ul>\n<li>\n<p>Provide initial and timely responses to all support cases for a variety of topics, from billing or pre-sales requests to optimization or implementation questions.</p>\n</li>\n<li>\n<p>Triage support cases including directing users to previous answers, code examples, documentation, or escalating to specific technical or business team members.</p>\n</li>\n<li>\n<p>Monitor multiple feedback channels, e.g. Github Issues &amp; Discussions (check them here: <a href=\"https://github.com/supabase/supabase/issues\">https://github.com/supabase/supabase/issues</a>).</p>\n</li>\n<li>\n<p>Identify where internal tooling might be developed or obtained to improve support efficiency.</p>\n</li>\n<li>\n<p>Reproduce issues, create test cases and improve test coverage, if you have experience with testing.</p>\n</li>\n</ul>\n<p><strong>You are:</strong></p>\n<ul>\n<li>\n<p>Experienced in customer support, with 3+ years of experience providing developer support to technical customers.</p>\n</li>\n<li>\n<p>Proficient in SQL (ideally PostgreSQL). You feel comfortable with complex SQL queries. If you have a database administration experience, it’s a plus.</p>\n</li>\n<li>\n<p>Excellent communication skills and fluency in English.</p>\n</li>\n<li>\n<p>Skilled in using Linux/Unix operating systems and the command line.</p>\n</li>\n<li>\n<p>Experienced working with GitHub Issues and Discussions.</p>\n</li>\n<li>\n<p>Bonus points if you're familiar with popular JavaScript frameworks like React, Vue, and Svelte and have some experience with Node.js.</p>\n</li>\n<li>\n<p>Having a degree in Computer Science is a plus too.</p>\n</li>\n</ul>\n<h3>Timezones &amp; Logistics</h3>\n<ul>\n<li>\n<p>It’s a full-time position with a required location in European time zones (we don’t believe in sustainability of overnight shifts).</p>\n</li>\n<li>\n<p>This position covers Monday → Friday</p>\n</li>\n</ul>\n<h3><strong>What We Offer</strong></h3>\n<ul>\n<li>\n<p><strong>Fully Remote</strong></p>\n<p>We hire globally. We believe you can do your best work from anywhere. There are no Supabase offices, but we provide a WeWork membership or co-working allowance you can use anywhere in the world.</p>\n</li>\n<li>\n<p><strong>ESOP</strong></p>\n<p>Every team member receives ESOP (equity ownership) in the company. We want everyone to share in the upside of what we’re building together.</p>\n</li>\n<li>\n<p><strong>Tech Allowance</strong></p>\n<p>Use this budget to set up your ideal work environment—laptop, monitor, headphones, or whatever helps you do your best work.</p>\n</li>\n<li>\n<p><strong>Health Benefits</strong></p>\n<p>Supabase covers 100% of health insurance for employees and 80% for dependents, wherever you are. Your wellbeing and your family’s health are important to us.</p>\n</li>\n<li>\n<p><strong>Annual Off-Sites</strong></p>\n<p>Once a year, the entire company gathers in a new city for a week of connection, collaboration, and fun. It’s a highlight of our year.</p>\n</li>\n<li>\n<p><strong>Flexible Work</strong></p>\n<p>We operate asynchronously and trust you to manage your own time. You know what needs to be done and when.</p>\n</li>\n<li>\n<p><strong>Professional Development</strong></p>\n<p>Every team member receives an annual education allowance to spend on learning—courses, books, conferences, or anything that supports your growth.</p>\n\n</li>\n</ul>\n<h3><strong>About the Team</strong></h3>\n<p>Supabase was born-remote and open-source-first. We believe our globally distributed team is our secret weapon in building tools developers love.</p>\n<ul>\n<li>\n<p>~400 team members</p>\n</li>\n<li>\n<p>60+ countries</p>\n</li>\n<li>\n<p>20+ languages spoken</p>\n</li>\n<li>\n<p>Over $1B raised (including our $500M Series F)</p>\n</li>\n<li>\n<p>540,000+ community members</p>\n</li>\n</ul>\n<p>We move fast, build in public, and use what we ship. If it’s in your project, we probably use it in ours too. We believe deeply in the open-source ecosystem and strive to support—not replace—existing tools and communities.</p>", "datePosted": "2026-09-29T03:35:15+00:00", "employmentType": "Full-Time", "hiringOrganization": {"@type": "Organization", "name": "Supabase", "logo": "https://jobicy.com/data/server-nyc0409/galaxy/mercury/2026/06/611d3bfa-221.png"}, "applicantLocationRequirements": {"@type": "Country", "name": "Europe"}, "jobLocationType": "TELECOMMUTE", "directApply": false, "url": "https://workationbase.com/jobs/support-engineer-emea-supabase-152053"}]</script><main><a href="https://jobicy.com/jobs/152053-support-engineer-emea?utm_source=workationbase&amp;utm_medium=referral&amp;utm_campaign=jobs" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-[12px] bg-ink text-canvas font-semibold text-[15px] hover:opacity-90 transition-opacity">Jetzt bewerben<svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" str
