alable batch pipelines that complement our existing Flink-based streaming platform. Develop robust controls for data completeness, freshness, anomaly detection, reconciliation, and business-logic accuracy. Build observability capabilities that surface pipeline failures, data drift, and quality issues before they affect downstream models or fraud rules. Partner with Data Scientists and Fraud Ops to translate fraud-prevention use cases into scalable, resilient data products while maintaining consistency between batch and real-time processing. QualificationsCloud Data Engineering: experience building production data pipelines using Python, Airflow, dbt, and BigQuery on GCP or AWS.Stream Processing: hands-on experience with Apache Flink or a similar framework, including event time, state, checkpointing, and late-arriving data. Data Science Enablement: a strong understanding of feature preparation, model training, backtesting, and inference workflows. Data Quality and Observability: experience building validation frameworks, monitoring, alerting, and data lineage for production systems. Engineering Ownership: a track record of owning data solutions from design and implementation through deployment and operations. Additional InformationEnsuring you and all our Heroes are looked after, happy, and healthy is always on the menu. Because if you’re in good shape, then we’re in good shape.Make the most of our hybrid working model and join the team for face-to-face connection and collaboration in our beautiful Berlin campus 2 days a weekWe offer 27 days holiday with an extra day on 2nd and 3rd year of serviceWe will support you in developing yourself and your career growth opportunities: 1.000 € Educational Budget, Language Courses, Parental Support and access to the Udemy Business platform to explore a variety of online courses. Get moving and release those wonderful, mind-boosting endorphins: Health Checkups, Meditation, Gym Subsidy. Cash. Dough. Cheddar. Whatever you call it,
