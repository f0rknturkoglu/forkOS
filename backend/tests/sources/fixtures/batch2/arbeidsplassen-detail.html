<script>self.__next_f.push([1, "1:{\"adData\": {\"id\": \"8daad088-3570-4a1f-a0fa-af611aece378\", \"status\": \"ACTIVE\", \"title\": \"Utvendig rengjørings-tekniker søkes!\", \"source\": \"Stillingsregistrering\", \"reference\": \"8daad088-3570-4a1f-a0fa-af611aece378\", \"medium\": \"Stillingsregistrering\", \"published\": \"2026-09-30T21:17:52.000Z\", \"updated\": \"2026-09-30T21:18:33.732Z\", \"expires\": \"2027-03-30T21:17:52.554Z\", \"application\": {\"applicationDueDate\": null, \"applicationDueLabel\": \"Snarest\", \"hasSuperraskSoknad\": true, \"applicationEmail\": null, \"applicationUrl\": null}, \"adTextFormat\": \"strukturert\", \"engagementType\": \"Fast\", \"jobArrangement\": \"Turnus\", \"jobTitle\": \"Fasaderenholder\", \"positionCount\": 1, \"remoteOptions\": \"Hjemmekontor ikke mulig\", \"aiRemoteOptions\": \"Ikke oppgitt\", \"startDate\": null, \"startDateLabel\": \"Etter avtale\", \"extent\": [\"Heltid\"], \"workDays\": [\"Ukedager\"], \"workHours\": [\"Dagtid\", \"Kveld\"], \"jobPercentage\": null, \"workLanguages\": [\"Norsk\", \"Skandinavisk\", \"Engelsk\"], \"adTextHtml\": \"<section id=\\\"arb-aapningstekst\\\">\\n<p>Bli med på laget!</p>\\n<p>Eiendomsvask AS er i vekst, og vi søker en praktisk og arbeidsvillig tekniker til vårt team. Hos oss får du en variert arbeidshverdag med fasadevask, takvask, takfornying, maling og overflatebehandling – med profesjonelt utstyr og gode utviklingsmuligheter.</p>\\n</section>\\n<section id=\\\"arb-serEtter\\\">\\n<h2>Hva vi ser etter</h2>\\n<p>Vi ser etter deg som er ivrig!</p>\\n<p>Du trenger verken utdannelse eller kompetanse men vi ser på hvilke verdier du lever ved og jobber sammen ilag om å åpnå felles interesse. Vi har noen ganger tunge jobber og noen ganger enkle jobber. Du må ikke være høyderedd men vil få nødvendig trening på fallsikring og nødvendig kurs!</p>\\n</section>\\n<section id=\\\"arb-arbeidsoppgaver\\\">\\n<h2>Arbeidsoppgaver</h2>\\n<p>Som tekniker hos Eiendomsvask AS vil du få en variert og praktisk arbeidshverdag. Arbeidsoppgavene vil blant annet være:</p>\\n<ul><li>\\n<p>Fasadevask og softwash</p>\\n</li><li>\\n<p>Takvask og takfornying</p>\\n</li><li>\\n<p>Maling og overflatebehandling</p>\\n</li><li>\\n<p>Impregnering av fasader og andre overflater</p>\\n</li><li>\\n<p>Verksted- og industrirengjøring</p>\\n</li><li>\\n<p>Bruk av høytrykkspumper, malepumper og annet profesjonelt utstyr</p>\\n</li><li>\\n<p>Rigging, klargjøring og rydding på arbeidsstedet</p>\\n</li><li>\\n<p>Enkel kontroll og vedlikehold av maskiner og utstyr</p>\\n</li><li>\\n<p>Kundekontakt og gjennomføring av oppdrag</p>\\n</li><li>\\n<p>Sikre at arbeidet utføres effektivt, trygt og med høy kvalitet</p>\\n</li></ul>\\n<p>Du vil få opplæring i våre arbeidsmetoder og utstyr. Det vil også være mulighet for mer ansvar etter hvert for den som viser initiativ og ønsker å utvikle seg.</p>\\n</section>\\n<section id=\\\"arb-tilbyr\\\">\\n<h2>Vi tilbyr</h2>\\n<h3>Dette tilbyr vi</h3>\\n<ul><li>\\n<p>En variert og aktiv arbeidshverdag</p>\\n</li><li>\\n<p>Grundig opplæring -- erfaring fra bransjen er en fordel, men ikke et krav</p>\\n</li><li>\\n<p>Profesjonelt utstyr og gode arbeidsmetoder</p>\\n</li><li>\\n<p>Gode lønnsbetingelser etter avtale</p>\\n</li><li>\\n<p>Mulighet for mye arbeid og ekstra inntekt i høysesongen</p>\\n</li><li>\\n<p>Mulighet for eierskap for riktig kandidat</p>\\n</li><li>\\n<p><strong>Sesongbasert arbeidstidsordning</strong>, med mulighet for lengre friperioder i vintermånedene</p>\\n</li><li>\\n<p>Mulighet for faglig utvikling og mer ansvar over tid</p>\\n</li><li>\\n<p>Et godt arbeidsmiljø i en bedrift i vekst</p>\\n</li><li>\\n<p>Mulighet til å bli en viktig del av videre utvikling av Eiendomsvask AS</p>\\n</li></ul>\\n<p>Vi legger stor vekt på <strong>innsats, kvalitet og godt kundearbeid</strong>, og ønsker å bygge et team hvor man trives og har mulighet til å utvikle seg.</p>\\n</section>\", \"sourceUrl\": null, \"employer\": {\"name\": \"Eiendomsvask As\"}, \"locationList\": [{\"address\": null, \"postalCode\": null, \"county\": \"TELEMARK\", \"municipal\": null, \"city\": null, \"country\": \"NORGE\"}, {\"address\": null, \"postalCode\": null, \"county\": \"AGDER\", \"municipal\": null, \"city\": null, \"country\": \"NORGE\"}, {\"address\": null, \"postalCode\": null, \"county\": \"VESTFOLD\", \"municipal\": null, \"city\": null, \"country\": \"NORGE\"}], \"isZodError\": false}}\n"])</script>
