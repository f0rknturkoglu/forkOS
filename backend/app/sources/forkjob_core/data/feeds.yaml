# TEMPLATE — user-defined RSS job feeds live elsewhere.
#
# This file is committed to git, so it MUST stay free of personal data. Your
# own feeds live in `feeds.yaml.user` next to this file, which .gitignore
# excludes; manage them from the web UI, never by hand.
#
# Every enabled feed is fetched by the `customfeeds` source on the next sync.
#
# Feed fields:
#   url       required — the feed URL (RSS or Atom)
#   name      optional — label shown in the list; defaults to the host
#   kind      optional — "rss" (default), or "page" for a company careers page
#   selectors optional — kind "page" only; item/title/link/location/department
#   remote    optional — true if everything on this feed is remote work
#   country   optional — ISO-3166 alpha-2 to stamp on postings with no location
#   enabled   optional — false to keep a feed without fetching it

version: 1
feeds: []
