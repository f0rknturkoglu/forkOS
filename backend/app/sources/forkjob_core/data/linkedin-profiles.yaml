# TEMPLATE — user-defined LinkedIn search profiles live elsewhere.
#
# This file is committed to git, so it MUST stay free of personal data. Your
# own profiles live in `linkedin-profiles.yaml.user` next to this file, which
# .gitignore excludes; manage them from the web UI, never by hand.
#
# Default profiles from data/portals.yaml are merged with yours at sync time;
# both sets run together.
#
# Profile fields:
#   term              required — search keyword (e.g. "backend engineer")
#   location          optional — city or country (e.g. "Germany")
#   results_wanted    optional — how many results (default 50)
#   hours_old         optional — only postings this recent (e.g. 72)
#   is_remote         optional — true for remote-only
#   fetch_description optional — fetch full description (slower, more requests)

version: 1
profiles: []
