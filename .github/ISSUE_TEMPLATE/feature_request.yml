name: Feature Request
description: Suggest an idea or enhancement for forkOS
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make forkOS better? We'd love to hear it. Remember that forkOS is strictly local-only and single-user.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Goal
      description: Is your feature request related to a problem or a specific workflow?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
      placeholder: It would be great if forkOS could...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered?
