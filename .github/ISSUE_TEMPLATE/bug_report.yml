name: Bug Report
description: Report a bug, crash, or unexpected behavior in forkOS
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please ensure you've checked `python3 scripts/forkos.py doctor` before filing.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Run '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Diagnostics (`forkos doctor`) Output
      description: Paste the output of `python3 scripts/forkos.py doctor` or container logs.
      render: shell

  - type: dropdown
    id: environment
    attributes:
      label: Runtime Environment
      options:
        - macOS (Docker Desktop / OrbStack)
        - Linux (Docker Compose)
        - Podman Compose
        - Other
    validations:
      required: true
