# Gunluk (stable) runtime icin statik sunucu.
#
# Derlenmis SPA'yi servis eder ve /api'yi FastAPI'ye devreder. Boylece gunluk
# kullanimda Vite dev server, HMR ve dosya izleyici calismaz; uygulama ve API
# ayni origin'de (5173) durur.
#
# Container icinde de 5173 dinlenir: port eslesmesi dev overlay'iyle ayni kalir
# (compose.yaml + compose.dev.yaml), boylece overlay port listesini degistirmez.

server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Not / gorsel / belge ekleri bu proxy'den gecer; varsayilan 1m siniri
    # yuklemeleri 413 ile kirardi.
    client_max_body_size 512m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uzun suren disa aktarma / yenileme istekleri icin.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # --- PWA ---------------------------------------------------------------
    # Service worker ve manifest ASLA uzun omurlu cache'lenmez; aksi halde
    # registerType: "autoUpdate" yeni surumu goremez.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }

    # --- Statik ------------------------------------------------------------
    # Vite dosya adlarina icerik hash'i koyar: uzun omurlu cache guvenli.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /excalidraw-assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback. index.html cache'lenmez: yeni derleme hemen gorunmeli.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
