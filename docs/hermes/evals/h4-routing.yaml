    labels: [calendar_event, deadline, task, knowledge]
    classification_goal: "Metni en uygun kategoriye ata."
    config:
      enabled: false
    provider:
      script: ok
    expect:
      status: error
      selected_slot: null
      failure_code: H4_DISABLED
