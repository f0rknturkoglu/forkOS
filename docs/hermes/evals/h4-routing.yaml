    lane: query_rewrite
    text: |
      forkjob için uzun bir yeniden yazım denemesi yap.
    protected_terms: [forkjob]
    config:
      small_model: ""
    provider:
      script: ok
      responses:
        - '{"rewritten_query": "forkjob router notes about the local model selection and the validation rules for the structured extraction lane and the classification lane and the query rewrite lane and the routing decision table and the retry budget policy and the sticky escalation rule and the protected term verification step"}'
    expect:
      status: needs_escalation
      selected_slot: local-medium
      reason_codes: [LANE_QUERY_REWRITE, LOCAL_SMALL_UNAVAILABLE, ESCALATED_TO_LOCAL_MEDIUM, LOCAL_MEDIUM_VALIDATION_FAILED]
      failure_code: VALIDATION_FAILED
      attempts: 1

  # Boş yeniden yazım → OUTPUT_SCHEMA_MISMATCH.
  - id: qr-empty-01
    category: rewrite_validation
    lane: query_rewrite
    text: |
      Empty rewrite probe for the local router decision path.
    protected_terms: [local router]
    config:
      small_model: ""
    provider:
      script: ok
      responses:
        - '{"rewritten_query": ""}'
    expect:
      status: needs_escalation
      selected_slot: local-medium
      reason_codes: [LANE_QUERY_REWRITE, LOCAL_SMALL_UNAVAILABLE, ESCALATED_TO_LOCAL_MEDIUM, LOCAL_MEDIUM_VALIDATION_FAILED]
      failure_code: VALIDATION_FAILED
      attempts: 1

  # --------------------------------------------------------- bütçe yönlendirme
  # small bütçesi (50 karakter) aşılır, medium bütçesine sığar → medium seçilir.
  - id: route-overflow-01
    category: routing
    lane: classify
    text: |
      Kurgusal Uzun Not
      Bu not elli karakterden uzun olduğu için küçük model bütçesine sığmıyor.
    labels: [calendar_event, deadline, task, knowledge]
    classification_goal: "Metni en uygun kategoriye ata."
    config:
      small_input_chars: 50
    provider:
      script: ok
      responses:
        - '{"label": "task"}'
    expect:
      status: success
      selected_slot: local-medium
      reason_codes: [LANE_CLASSIFY, LOCAL_SMALL_CONTEXT_EXCEEDED, ESCALATED_TO_LOCAL_MEDIUM]
      failure_code: null

  # Hiçbir bütçeye sığmayan girdi → CONTEXT_TOO_LARGE (model çağrısı yok).
  - id: route-context-01
    category: routing
    lane: classify
    text: |
      Kurgusal Çok Uzun Not
      Bu sentetik not iki yüz karakterden uzundur ve hiçbir yerel model bütçesine sığmaz.
      Amaç bağlam taşması yolunu deterministik olarak tekrar oynatmaktır.
      Bu satır yalnızca uzunluğu artırmak için yazılmıştır.
      Son satır da aynı amaçla burada durmaktadır.
    labels: [calendar_event, deadline, task, knowledge]
    classification_goal: "Metni en uygun kategoriye ata."
    config:
      small_input_chars: 100
      medium_input_chars: 200
    provider:
      script: ok
    expect:
      status: error
      selected_slot: null
      failure_code: CONTEXT_TOO_LARGE

  # small yapılandırılmamış (model boş) → medium seçilir ve başarır.
  - id: route-nosmall-01
    category: routing
    lane: classify
    text: |
      Kurgusal Kısa Not
      Yarın sentetik bir okuma grubu toplantısı var.
    labels: [calendar_event, deadline, task, knowledge]
    classification_goal: "Metni en uygun kategoriye ata."
    config:
      small_model: ""
    provider:
      script: ok
      responses:
        - '{"label": "calendar_event"}'
    expect:
      status: success
      selected_slot: local-medium
      reason_codes: [LANE_CLASSIFY, LOCAL_SMALL_UNAVAILABLE, ESCALATED_TO_LOCAL_MEDIUM]
      failure_code: null

  # medium da yoksa hiçbir uygun slot kalmaz → NO_ELIGIBLE_MODEL.
  - id: route-nomodel-01
    category: routing
    lane: classify
    text: |
      Kurgusal Kısa Not
      Model yapılandırması boş bırakılmış bir deneme.
    labels: [calendar_event, deadline, task, knowledge]
    classification_goal: "Metni en uygun kategoriye ata."
    config:
      small_model: ""
      medium_model: ""
    provider:
      script: ok
    expect:
      status: error
      selected_slot: null
      failure_code: NO_ELIGIBLE_MODEL

  # ---------------------------------------------------------- deneme bütçesi
  # small ilk denemede düşer, ikinci denemede başarır → medium ÇAĞRILMAZ.
  - id: retry-01
    category: retry_budget
    lane: classify
    text: |
      Kurgusal Tekrar Deneme Notu
      İlk yanıt geçersiz, ikinci yanıt geçerli olacak.
    labels: [calendar_event, deadline, task, knowledge]
    classification_goal: "Metni en uygun kategoriye ata."
    provider:
      script: ok
      responses:
        - '{"label": "meeting"}'
        - '{"label": "task"}'
    expect:
      status: success
      selected_slot: local-small
      reason_codes: [LANE_CLASSIFY, LOCAL_SMALL_SELECTED]
      failure_code: null
      attempts: 2

  # small iki kez düşer → medium başarır; yukarı yapışkan, tavan 3 deneme.
  - id: retry-02
    category: retry_budget
    lane: classify
    text: |
      Kurgusal Yukarı Çıkış Notu
      small iki kez düşecek, medium başaracak.
    labels: [calendar_event, deadline, task, knowledge]
    classification_goal: "Metni en uygun kategoriye ata."
    provider:
      script: ok
      responses:
        - '{"label": "meeting"}'
        - '{"label": "meeting"}'
        - '{"label": "knowledge"}'
    expect:
      status: success
      selected_slot: local-medium
      reason_codes: [LANE_CLASSIFY, LOCAL_SMALL_VALIDATION_FAILED, ESCALATED_TO_LOCAL_MEDIUM]
      failure_code: null
      attempts: 3

  # -------------------------------------------------------- sağlayıcı betiği
  # Bozuk JSON gövdesi → her deneme doğrulama düşer, tavan dolar.
  - id: provider-malformed-01
    category: provider_script
    lane: classify
    text: |
      Kurgusal Bozuk Yanıt Notu
      Sağlayıcı JSON olmayan bir gövde döndürecek.
    labels: [calendar_event, deadline, task, knowledge]
    classification_goal: "Metni en uygun kategoriye ata."
    provider:
      script: malformed_json
    expect:
      status: needs_escalation
      selected_slot: local-small
      reason_codes: [LANE_CLASSIFY]
      failure_code: LOCAL_CAPABILITY_UNAVAILABLE

  # Boş gövde → şema doğrulaması geçilemez.
  - id: provider-empty-01
    category: provider_script
    lane: query_rewrite
    text: |
      Fictional empty output probe for the router.
    protected_terms: [router]
    provider:
      script: empty_output
    expect:
      status: needs_escalation
      selected_slot: local-small
      reason_codes: [LANE_QUERY_REWRITE]
      failure_code: LOCAL_CAPABILITY_UNAVAILABLE

  # Yanıt yok (zaman aşımı) → sağlayıcı erişilemez.
  - id: provider-timeout-01
    category: provider_script
    lane: structured_extract
    text: |
      Kurgusal Zaman Aşımı Notu
      Ödeme son tarihi 8 Aralık 2026 olarak duyuruldu.
    contract: deadline_candidates_v1
    provider:
      script: timeout
    expect:
      status: needs_escalation
      selected_slot: local-small
      reason_codes: [LANE_STRUCTURED_EXTRACT, STRUCTURED_OUTPUT_REQUIRED]
      failure_code: MODEL_PROVIDER_UNAVAILABLE

  # medium kurulu değil (small zaten yapılandırılmamış) → MODEL_UNAVAILABLE.
  - id: provider-missing-01
    category: provider_script
    lane: classify
    text: |
      Kurgusal Kurulu Olmayan Model Notu
      Yalnızca medium denenebilir ve o da kurulu değildir.
    labels: [calendar_event, deadline, task, knowledge]
    classification_goal: "Metni en uygun kategoriye ata."
    config:
      small_model: ""
    provider:
      script: model_missing
    expect:
      status: needs_escalation
      selected_slot: local-medium
      reason_codes: [LANE_CLASSIFY, LOCAL_SMALL_UNAVAILABLE]
      failure_code: MODEL_UNAVAILABLE

  # ------------------------------------------------------------ geçersiz girdi
  # Reddedilen lane (rerank H4.1 araştırması) → INVALID_LANE.
  - id: lane-reason-01
    category: invalid_lane
    lane: reason
    text: |
      Kurgusal Akıl Yürütme İsteği
      Bu lane H4 sürümünde aktif değildir.
    provider:
      script: ok
    expect:
      status: error
      selected_slot: null
      failure_code: INVALID_LANE

  - id: lane-rerank-01
    category: invalid_lane
    lane: rerank
    text: |
      Fictional rerank probe.
      This lane is not active in the H4 surface.
    provider:
      script: ok
    expect:
      status: error
      selected_slot: null
      failure_code: INVALID_LANE

  # classify + contract birlikte verilemez → INVALID_ARGUMENT.
  - id: arg-classify-contract-01
    category: invalid_argument
    lane: classify
    text: |
      Kurgusal Çelişkili Argüman Notu
      classify lane ile sözleşme birlikte verildi.
    labels: [calendar_event, deadline, task, knowledge]
    classification_goal: "Metni en uygun kategoriye ata."
    contract: academic_calendar_v1
    provider:
      script: ok
    expect:
      status: error
      selected_slot: null
      failure_code: INVALID_ARGUMENT

  # Bilinmeyen sözleşme sürümü → INVALID_ARGUMENT.
  - id: arg-unknown-contract-01
    category: invalid_argument
    lane: structured_extract
    text: |
      Kurgusal Bilinmeyen Sözleşme Notu
      Ders içeriği 3 Şubat 2027 tarihinde yayımlanacak.
    contract: syllabus_v9
    provider:
      script: ok
    expect:
      status: error
      selected_slot: null
      failure_code: INVALID_ARGUMENT

  # ------------------------------------------------------------ gizlilik sınırı
  # Loopback dışı uç nokta → INVALID_LOCAL_MODEL_ENDPOINT (bağlantı DENENMEZ).
  - id: endpoint-cloud-01
    category: privacy_boundary
    lane: classify
    text: |
      Kurgusal Sınır İhlali Notu
      Uzak bir sağlayıcı adresi verildi.
    labels: [calendar_event, deadline, task, knowledge]
    classification_goal: "Metni en uygun kategoriye ata."
    config:
      endpoint: "https://api.somecloud.com"
    provider:
      script: ok
    expect:
      status: error
      selected_slot: null
      failure_code: INVALID_LOCAL_MODEL_ENDPOINT

  # ----------------------------------------------------------------- kapılar
  # H4_ENABLED=false → H4_DISABLED (hiçbir lane çalışmaz).
  - id: disabled-01
    category: config_gate
    lane: classify
    text: |
      Kurgusal Kapalı Özellik Notu
