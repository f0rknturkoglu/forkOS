# forkOS × Hermes — H4 (Local Cognition Router) yönlendirme + doğrulama vakaları
#
# Araç: forkos_local_cognition · Yürütme sınırı: local_loopback
# Lane seti: classify | structured_extract | query_rewrite
#   (rerank / compress / reason / chat / answer / plan → INVALID_LANE; H4.1 ve H5
#    araştırma konusudur, bu sürümde AKTİF DEĞİL.)
#
# Tüm metinler SENTETİKTİR: uydurma ders adları, uydurma tarihler, ayrılmış
# .invalid alan adları. Gerçek kişisel veri, gerçek kurum adı veya gerçek
# kullanıcı içeriği YOKTUR.
#
# Yeniden oynatma kuralları:
#   script: ok               → responses sırayla denenir; son eleman tekrarlanır
#                              ve HER girdi ilgili lane doğrulayıcısından geçmelidir
#   script: malformed_json   → JSON olmayan gövde
#   script: empty_output     → boş gövde
#   script: timeout          → yanıt yok (responses yazılmaz)
#   script: model_missing    → model kurulu değil (responses yazılmaz)
#
# config yalnızca varsayılandan FARKLI bir şey test edildiğinde yazılır.
# Varsayılan: small_model=local-small-model, medium_model=local-medium-model,
# ikisi de healthy, small_input_chars=12000, medium_input_chars=24000,
# endpoint=http://127.0.0.1:11434, enabled=true.
#
# Deneme tavanı: local-small toplam 2, local-medium toplam 1, toplam ≤ 3.
# Yukarı yapışkanlık: small → medium geçişi geri dönmez.

version: 1
# selected_slot: yonlendirmenin ILK deneme icin sectigi slottur.
#   - success/needs_escalation: secilen slot yazilir (local-small | local-medium)
#   - yalnizca hicbir slot UYGUN DEGILSE (veya arguman hatasi varsa) null olur
#   - needs_escalation + LOCAL_CAPABILITY_UNAVAILABLE: iki slot da denendi
#   - needs_escalation + VALIDATION_FAILED: tek slot denendi (daha guclusu yok)
cases:
  # ---------------------------------------------------------------- classify
  - id: tr-classify-01
    category: tr_classify
    lane: classify
    text: |
      Kurgusal Takvim Notu
      29 Kasım 2026 tarihinde ALES deneme sınavı var.
      Kayıt işlemleri bu hafta içinde kapanıyor.
    labels: [calendar_event, deadline, task, knowledge]
    classification_goal: "Metni en uygun kategoriye ata."
    provider:
      script: ok
      responses:
        - '{"label": "deadline"}'
    expect:
      status: success
      selected_slot: local-small
      reason_codes: [LANE_CLASSIFY, LOCAL_SMALL_SELECTED]
      failure_code: null
      attempts: 1

  - id: en-classify-01
    category: en_classify
    lane: classify
    text: |
      Fictional Study Log
      The synthetic study group meets on Friday to walk through the vector index notes.
      Nothing is due this week.
    labels: [calendar_event, deadline, task, knowledge]
    classification_goal: "Assign the single best category for the text."
    provider:
      script: ok
      responses:
        - '{"label": "calendar_event"}'
    expect:
      status: success
      selected_slot: local-small
      reason_codes: [LANE_CLASSIFY, LOCAL_SMALL_SELECTED]
      failure_code: null
      attempts: 1

  # Negatif: "meeting" labels listesinde yok → INVALID_CLASS_LABEL.
  # small iki denemede de düşer, medium da düşer → yukarı yapışkan, tavan dolar.
  - id: tr-classify-02
