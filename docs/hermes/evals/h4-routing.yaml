        - '{"label": "meeting"}'
    expect:
      status: needs_escalation
      selected_slot: local-small
      reason_codes: [LANE_CLASSIFY, LOCAL_SMALL_VALIDATION_FAILED, ESCALATED_TO_LOCAL_MEDIUM, LOCAL_MEDIUM_VALIDATION_FAILED]
      failure_code: LOCAL_CAPABILITY_UNAVAILABLE
