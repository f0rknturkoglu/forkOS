# forkOS × Hermes — H6 (Proaktivite / Dikkat Kontrolü) karar vakaları
#
# Araç: forkos_proactivity · Karar noktası: policy.decide() — SAF, veritabanı ve
# model çağrısı YOK; aynı girdi her zaman aynı kararı verir.
# Kapsam: kapalı kural kümesi (morning_continuity, daily_close, weekly_review,
# deadline_staircase, continuity_gap, project_stalled) + servis yaşam döngüsü.
#
# Tüm veriler SENTETİKTİR: gerçek kişi, gerçek kayıt veya gerçek içerik YOKTUR.
# `state` yalnızca kategorik eşikler taşır; kişisel veri taşımaz.
#
# ÇAPA (tüm vakalar için):
#   yerel şimdi = 2026-09-21T14:00:00+03:00  →  UTC 2026-09-21T11:00:00Z
#   state.local_time verilirse yerel çapa o saate taşınır; now = yerelin UTC karşılığı.
#
# state alanları → policy.PolicyInput eşlemesi:
#   master_enabled · rule_enabled · one_shot · category · delivery_count ·
#   cooldown_hours · focus_active · focus_deferral_enabled ·
#   immediate_surfaces_today · immediate_budget        → aynı adla
#   snoozed: true                                      → snoozed_until = now + 3h
#   last_delivered_at: null | "-48h" | "-8d"           → now + göreli ofset
#   quiet_hours: null | ["HH:MM", "HH:MM"]             → (time, time) demeti
#   local_time                                         → local_now saat/dakika
#   (sabit) run_state = "candidate", why_now = null     → karar metnini etkilemez
#
# lifecycle != null → saf politika DEĞİL, servis yaşam döngüsü vakası:
#   revalidate_failed     teslim öncesi rules.revalidate False → service.resolve_run
#                         → reason_codes ["CONDITION_RESOLVED"]
#   stale_trigger         service.cancel_stale_episodes (son tarih revizyonu değişti)
#                         → ["STALE_TRIGGER"]
#   rule_disabled         service.cancel_pending (kural kapatıldı) → ["RULE_DISABLED"]
#   no_meaningful_content teslim anında anlamlı olgu yok → suppressed → ["NO_MEANINGFUL_CONTENT"]
#   duplicate_delivery    bildirim dedup'ı tuttu → suppressed → ["DUPLICATE_TRIGGER"]
#   snooze_expired        `snoozed` koşunun süresi doldu → yeniden `candidate` +
#                         güncel karar (§7; davranış politika kararıyla aynıdır)
#
# expected_outcome: silent | defer | digest | surface | prepare | cancel
#   (servis düzeyindeki "suppressed" durumu burada "silent" olarak ifade edilir)
#
# DURUM: 42 vaka; 20'si sessizlik/erteleme (negatif). Saf politika vakalarının
# tamamı gerçek policy.decide() ile birebir oynatıldı.

version: 1
