# forkOS — GUNLUK (stable) runtime.
#
# Bu dosya gunluk kullanim icindir: Vite dev server, HMR, dosya izleyici ve
# `uvicorn --reload` YOKTUR. Frontend onceden derlenmis statik dosya olarak
# nginx ile servis edilir, API uretim modunda kosar.
#
# Gelistirme (Vite + HMR + --reload + source mount):
#   make up-dev          ->  compose.yaml + compose.dev.yaml
#
# Podman:  podman compose up -d      (Podman 4.7+)
# Docker:  docker compose up -d
name: forkos

# Container loglari sinirsiz buyumesin. `json-file` hem Docker hem Podman'da
# gecerlidir (Podman'da k8s-file'a alias'lanir); `local` Docker'a ozgudur ve
# Podman'da hata verir. Docker'da daha verimli `local` surucusunu isterseniz:
#   LOG_DRIVER=local make up
x-logging: &logging
  driver: ${LOG_DRIVER:-json-file}
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILES:-3}"

services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifeos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifeos}
      POSTGRES_DB: ${POSTGRES_DB:-lifeos}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    # NAMED VOLUME — rootless podman'da bind mount UID mapping yüzünden initdb'yi patlatır
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifeos} -d ${POSTGRES_DB:-lifeos}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  api:
    build: ./backend
    # `--reload` YOK: gunluk runtime'da kaynak izleyici ve yeniden baslatma yok.
    # Bu imaj kaynagi kopyalar; backend degisikliginden sonra `make build`.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8787
    # KALICI VERI: uygulamanin runtime'da YAZDIGI her sey host'a baglanir.
    # Bunlar olmadan gunluk runtime'da dosyalar container katmaninda kalir ve
    # container yeniden olusturulunca kaybolur (yerel belgeler, JSON yedekler,
    # gorsel onbellegi, jobhunter .user dosyalari, ekler).
    volumes:
      - ./backend/data:/app/data:z
      - ./backend/backups:/app/backups:z
      - ./backend/app/sources/forkjob_core/data:/app/app/sources/forkjob_core/data:z
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lifeos}:${POSTGRES_PASSWORD:-lifeos}@db:5432/${POSTGRES_DB:-lifeos}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      EXTENSION_ID: ${EXTENSION_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://127.0.0.1:8787/api/auth/google/callback}
      WORKER_ENABLED: ${WORKER_ENABLED:-0}
      A5_CONTEXT_MODE: ${A5_CONTEXT_MODE:-off}
      A5_JEVMLX_BASE_URL: ${A5_JEVMLX_BASE_URL:-http://host.docker.internal:8000}
      A5_CONTEXT_TIMEOUT_SECONDS: ${A5_CONTEXT_TIMEOUT_SECONDS:-1.5}
      # Fixed by Compose, not supplied by an agent request. Only this approved
      # local-machine bridge is added to the native loopback allowlist.
      A5_HOST_BRIDGE_ENABLED: "1"
      # Manuel yenileme worker kapaliyken API arka planinda kosar; LinkedIn
      # ayarlari orada da gerekir (bkz. .env.example).
      FORKJOB_LINKEDIN_ALLOW_DIRECT: ${FORKJOB_LINKEDIN_ALLOW_DIRECT:-0}
      FORKJOB_LINKEDIN_PROXIES_FILE: ${FORKJOB_LINKEDIN_PROXIES_FILE:-}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8787:8787"   # DIŞARI AÇMA — auth yok
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging

  worker:
    profiles: ["auto"]
    build: ./backend
    command: python -m app.worker.main
    # Worker da yazar: gecelik yedek + gorsel onbellegi (bkz. api servisi).
    volumes:
      - ./backend/data:/app/data:z
      - ./backend/backups:/app/backups:z
      - ./backend/app/sources/forkjob_core/data:/app/app/sources/forkjob_core/data:z
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lifeos}:${POSTGRES_PASSWORD:-lifeos}@db:5432/${POSTGRES_DB:-lifeos}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      RSS_DEFAULT_INTERVAL_MINUTES: ${RSS_DEFAULT_INTERVAL_MINUTES:-30}
      RSS_RETENTION_DAYS: ${RSS_RETENTION_DAYS:-90}
      # Direct (proxy'siz) LinkedIn erisimi VARSAYILAN KAPALI. Acmak icin
      # .env'de FORKJOB_LINKEDIN_ALLOW_DIRECT=1 yaz.
      FORKJOB_LINKEDIN_ALLOW_DIRECT: ${FORKJOB_LINKEDIN_ALLOW_DIRECT:-0}
      FORKJOB_LINKEDIN_PROXIES_FILE: ${FORKJOB_LINKEDIN_PROXIES_FILE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://127.0.0.1:8787/api/auth/google/callback}
      WORKER_ENABLED: "1"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    logging: *logging

  web:
    build:
      context: ./frontend
      target: prod
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
