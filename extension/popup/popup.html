<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <input id="title" placeholder="Baslik" />
    <input id="url" readonly />
    <textarea id="note" placeholder="Not"></textarea>
    <input id="tags" placeholder="Etiketler (virgulle)" />
    <select id="collection">
      <option value="inbox">Inbox</option>
      <option value="read_later">Read Later</option>
      <option value="learning">Learning</option>
      <option value="reference">Reference</option>
      <option value="projects">Projects</option>
    </select>
    <button id="save">Kaydet</button>
    <p id="status"></p>
    <div id="queue-status">
      <span id="pending-count">0 bekleyen</span>
      <span id="failed-count">0 başarısız</span>
    </div>
    <div id="failed-actions" hidden>
      <button id="retry-failed">Başarısızları yeniden dene</button>
      <button id="clear-failed">Başarısızları temizle</button>
    </div>
    <button id="open-options" class="secondary">Sunucu adresi</button>
    <div id="duplicate" hidden>
      <p>Bu sayfa zaten kayitli.</p>
      <button id="move-learning">Learning'e tasi</button>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
