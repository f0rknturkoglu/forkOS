<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>forkOS Capture Ayarları</title>
    <style>
      :root {
        --bg-canvas: #090c15;
        --bg-surface: #121829;
        --bg-surface-sunken: #0c101d;
        --border-subtle: #1e2840;
        --border-strong: #2d3c5f;
        --border-accent: #38bdf8;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --accent-primary: #0284c7;
        --accent-hover: #0369a1;
        --accent-light: #38bdf8;
        --color-ok: #10b981;
        --radius-md: 6px;
        --radius-lg: 8px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        max-width: 520px;
        margin: 48px auto;
        padding: 24px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        background-color: var(--bg-canvas);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
      }
      .card {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-lg);
        padding: 24px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      }
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        margin: 0;
        color: var(--text-primary);
      }
      h1 span {
        color: var(--accent-light);
        font-weight: 700;
      }
      p.subtitle {
        color: var(--text-secondary);
        font-size: 13px;
        margin: 0 0 20px 0;
      }
      form {
        display: grid;
        gap: 14px;
      }
      label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
        background: var(--bg-surface-sunken);
        color: var(--text-primary);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      input:focus {
        border-color: var(--border-accent);
        box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
      }
      button {
        width: 100%;
        padding: 10px 16px;
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        background: var(--accent-primary);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover {
        background: var(--accent-hover);
      }
      #status {
        margin: 4px 0 0 0;
        min-height: 1.5em;
        font-size: 12px;
        color: var(--color-ok);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <h1>fork<span>OS</span> Sunucu Ayarları</h1>
      </div>
      <p class="subtitle">
        OrbStack, Podman VM veya yerel API adresini belirle.
      </p>
      <form id="server-form">
        <label for="api-base">API Adresi</label>
        <input
          id="api-base"
          type="url"
          required
          placeholder="http://127.0.0.1:8787/api"
        />
        <label for="web-base"
          >Web uygulaması adresi (API portundan bağımsız)</label
        ><input id="web-base" type="url" required />
        <button type="submit">Kaydet ve İzin Ver</button>
        <p id="status" role="status"></p>
      </form>
    </div>
    <script type="module" src="options.js"></script>
  </body>
</html>
